<!DOCTYPE html>
<html lang="ur">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill Passport Challan Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <center class="owner"></center>
    </div>
    <div class="navbar">
        <div class="picture"></div>
        <div class="MENU">
            <a href="https://www.nadra.gov.pk/">NADRA</a>
            <a href="https://onlinemrp.dgip.gov.pk/">PASSPORT</a>
            <a href="https://www.nbp.com.pk/">NBP</a>
        </div>
    </div>
    <h2>IMRAN KHAN PASSPORT NAWESE</h2>
    <form id="challanForm">

        <label>Name:</label> <br>
        <input type="text" id="name"><br><br>

        <label for="name">N.I.C. No:</label> <br>
        <input type="text" id="nic"><br><br>

        <label for="address">Address:</label> <br>
        <input type="text" id="address"><br><br>

        <label for="amount">Fee Amount (in word.):</label> <br>
        <input type="text" id="amount"><br><br>

        <button type="button" onclick="fillPDF()">Download Filled PDF</button>
    </form>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.16.0/pdf-lib.min.js"></script>
    <script>
        async function fillPDF() {
            const pdfUrl = "PassportChallanForm.pdf"; // Aapke uploaded PDF ka path
            const existingPdfBytes = await fetch(pdfUrl).then(res => res.arrayBuffer());

            const {
                PDFDocument,
                rgb
            } = PDFLib;
            const pdfDoc = await PDFDocument.load(existingPdfBytes);
            const pages = pdfDoc.getPages();
            const firstPage = pages[0];

            // const caseNo = document.getElementById("caseNo").value;
            const date = new Date().toLocaleDateString();
            const name = document.getElementById("name").value;
            const nic = document.getElementById("nic").value;
            const address = document.getElementById("address").value;
            const amount = document.getElementById("amount").value;

            // 1st page

            firstPage.drawText(` ${date}`, {
                x: 220,
                y: 513,
                size: 12,
                color: rgb(0, 0, 0)
            });

            firstPage.drawText(`${name}`, {
                x: 100,
                y: 479,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(` ${nic}`, {
                x: 100,
                y: 460,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(` ${address}`, {
                x: 100,
                y: 444,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(`${amount}`, {
                x: 220,
                y: 165,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(`${amount}`, {
                x: 220,
                y: 300,
                size: 12,
                color: rgb(0, 0, 0)
            });
            //2nd page

            firstPage.drawText(` ${date}`, {
                x: 220 + 320,
                y: 513,
                size: 12,
                color: rgb(0, 0, 0)
            });

            firstPage.drawText(`${name}`, {
                x: 100 + 310,
                y: 479,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(` ${nic}`, {
                x: 100 + 310,
                y: 460,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(` ${address}`, {
                x: 100 + 310,
                y: 444,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(`${amount}`, {
                x: 220 + 320,
                y: 165,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(`${amount}`, {
                x: 220 + 320,
                y: 300,
                size: 12,
                color: rgb(0, 0, 0)
            });

            //3rd

            firstPage.drawText(` ${date}`, {
                x: 220 + 650,
                y: 513,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(`${name}`, {
                x: 100 + 650,
                y: 479,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(` ${nic}`, {
                x: 100 + 650,
                y: 460,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(` ${address}`, {
                x: 100 + 650,
                y: 444,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(`${amount}`, {
                x: 220 + 650,
                y: 165,
                size: 12,
                color: rgb(0, 0, 0)
            });
            firstPage.drawText(`${amount}`, {
                x: 220 + 650,
                y: 300,
                size: 12,
                color: rgb(0, 0, 0)
            });

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], {
                type: "application/pdf"
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Filled_PassportChallanForm.pdf";
            link.click();
        }
    </script>
</body>

</html>
